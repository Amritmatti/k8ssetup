# ============================================================================
#  cluster.conf  --  the ONLY file you normally need to edit
# ============================================================================

# ---------------------------------------------------------------------------
# 1) NODES:  "<label>  <ip>  [extra,labels=here]"
#    Role is derived from the label prefix:
#       master-* / control-* / cp-*  -> control plane
#       worker-* / node-*            -> worker
#    The label also becomes the VM hostname and the Kubernetes node name.
#    Use the host-only / bridged adapter IP (NOT the 10.0.2.15 NAT address).
# ---------------------------------------------------------------------------
NODES=(
  "master-1  192.168.1.180"
  "master-2  192.168.1.181"
  "master-3  192.168.1.182"
  "worker-1  192.168.1.183"
  "worker-2  192.168.1.184"
  "worker-3  192.168.1.185   disk=ssd,zone=lab"
)

# ---------------------------------------------------------------------------
# 2) Control-plane endpoint (HA virtual IP)
#    Must be a FREE address on the same subnet as the node IPs.
#    HAProxy + Keepalived are installed on the masters and float this VIP.
#    Single-master cluster? Leave VIP empty -- the first master's IP is used.
# ---------------------------------------------------------------------------
VIP="192.168.56.179"
VIP_PORT="8443"          # HAProxy front-end port (apiserver stays on 6443)
VIP_HOSTNAME="k8s-api"   # added to /etc/hosts + apiserver cert SANs
VRRP_ROUTER_ID="51"      # change if another keepalived runs on your LAN
VRRP_AUTH_PASS="k8sHAvip"

# ---------------------------------------------------------------------------
# 3) SSH access to the VMs (must be identical on every VM)
# ---------------------------------------------------------------------------
SSH_USER="ubuntu"
SSH_PORT="22"
SSH_KEY=""               # e.g. "$HOME/.ssh/id_rsa" -- empty = agent/default key
SSH_PASSWORD="ubuntu"          # set to use password auth (requires 'sshpass')
SUDO_PASSWORD="ubuntu"         # empty = passwordless sudo (NOPASSWD) or root user

# ---------------------------------------------------------------------------
# 4) Kubernetes
# ---------------------------------------------------------------------------
K8S_VERSION="1.33"                 # apt repo minor version (pkgs.k8s.io/v1.33)
POD_CIDR="10.244.0.0/16"
SERVICE_CIDR="10.96.0.0/12"
CNI="calico"                       # calico | flannel
CALICO_VERSION="v3.28.2"
FLANNEL_VERSION="v0.25.7"

# Multi-NIC VirtualBox VMs break CNI auto-detection (every VM has 10.0.2.15 on
# the NAT adapter). Leave "auto" to pin the CNI to the interface that can reach
# the first master. Override with e.g. "interface=enp0s8" for Calico.
CNI_IFACE_DETECT="auto"

# Where the admin kubeconfig is copied to on your workstation
KUBECONFIG_OUT="./kubeconfig"
